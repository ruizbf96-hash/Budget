<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget à deux</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#667684;--line:#d9e0e6;--teal:#0f766e;--red:#b4432f;--amber:#b7791f;color-scheme:light}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:1rem 1.4rem;background:var(--ink);color:#fff}
header h1{font-size:1.15rem;font-weight:800}
.bar{display:flex;gap:.8rem;align-items:center;font-size:.82rem;color:#b9c6d1}
.bar button,.ghost{background:none;border:1px solid #4a5b69;color:#fff;border-radius:6px;padding:.3rem .7rem;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:1.2rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1.4rem}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
.sum small{color:var(--mute);display:block;font-size:.76rem}
.sum b{font-size:1.35rem;font-weight:800}
.sum .rest{background:var(--ink);color:#fff;border-color:var(--ink)}
.sum .rest small{color:#b9c6d1}
.neg{color:#ff9d8a}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:1rem;overflow:hidden}
section h2{display:flex;justify-content:space-between;align-items:center;font-size:.98rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
section h2 span{color:var(--mute);font-weight:500}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:.75rem;font-weight:500;color:var(--mute);padding:.4rem .6rem}
td{padding:.15rem .3rem;border-top:1px solid var(--line)}
td input{width:100%;border:1px solid transparent;border-radius:6px;background:none;padding:.4rem .5rem}
td input:hover{border-color:var(--line)}
td input:focus{outline:2px solid var(--teal);background:#fff}
td input[type=number]{text-align:right;min-width:80px}
.by{color:var(--mute);font-size:.75rem;white-space:nowrap}
.m{color:var(--amber);font-weight:700;white-space:nowrap;font-size:.85rem}
.del{background:none;border:0;color:var(--mute);cursor:pointer;padding:.3rem .5rem}
.del:hover{color:var(--red)}
.add{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.6rem 1rem;color:var(--teal);font-weight:700;cursor:pointer}
.add:hover{background:#f4f8f8}
#login{min-height:100vh;display:grid;place-items:center;padding:1rem}
#lf{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.6rem;width:340px;max-width:100%;display:grid;gap:.7rem}
#lf h1{font-size:1.3rem;font-weight:800}
#lf input{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
#lf button{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:.65rem;font-weight:700;cursor:pointer}
.err{color:var(--red);font-size:.82rem;min-height:1.1em}
.empty{padding:1.4rem;text-align:center;color:var(--mute)}
.empty button{margin-top:.6rem;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.5rem 1rem;font-weight:700;cursor:pointer}
.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.frm{display:flex;gap:.5rem;flex-wrap:wrap;padding:.8rem 1rem}
.frm input,.frm select,#dm{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
#dl{flex:1;min-width:140px}
.frm button{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:.5rem 1rem;font-weight:700;cursor:pointer}
td select{width:100%;border:1px solid transparent;border-radius:6px;background:none;padding:.4rem .3rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.cv{position:relative;height:240px;padding:.8rem}
#pm{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
td.p{padding:.55rem .6rem;white-space:nowrap}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:4px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--teal)}
.bar.over i{background:var(--red)}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="lf">
    <h1>Budget à deux</h1>
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button>Se connecter</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>Budget à deux</h1>
    <div class="bar"><span id="sync">Connexion…</span><span id="who"></span><button id="out">Quitter</button></div>
  </header>
  <main>
    <div class="tabs"><button class="on" data-t="budget">Budget</button><button data-t="dep">Dépenses</button><button data-t="prev">Prévision</button></div>
    <div id="v-budget">
      <div class="sum" id="sum"></div>
      <div id="secs"></div>
    </div>
    <div id="v-dep" hidden>
      <div class="sum" id="dsum"></div>
      <section>
        <h2>Nouvelle dépense</h2>
        <div class="frm"><input id="dd" type="date"><input id="dl" placeholder="Libellé"><select id="dc"></select><input id="da" type="number" step="any" placeholder="Montant €"><button id="dadd">Ajouter</button></div>
      </section>
      <section>
        <h2>Dépenses du mois <input id="dm" type="month"></h2>
        <div class="wrap"><table><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Montant €</th><th>Modifié par</th><th></th></tr></thead><tbody id="dtb"></tbody></table></div>
      </section>
      <section>
        <h2>Budget vs réel par catégorie</h2>
        <div class="wrap"><table><thead><tr><th>Catégorie</th><th>Enveloppe € / mois</th><th>Réel €</th><th>Écart €</th><th>Utilisé</th></tr></thead><tbody id="etb"></tbody></table></div>
      </section>
      <section>
        <h2>Prévision du mois</h2>
        <div class="wrap"><table><tbody id="ptb"></tbody></table></div>
      </section>
      <div class="g2">
        <section><h2>Par catégorie</h2><div class="cv"><canvas id="c1"></canvas></div></section>
        <section><h2>6 derniers mois</h2><div class="cv"><canvas id="c2"></canvas></div></section>
      </div>
    </div>
    <div id="v-prev" hidden>
      <div class="sum" id="psum"></div>
      <section>
        <h2>Budget vs réel <input id="pm" type="month"></h2>
        <div class="wrap" id="ptab"></div>
      </section>
    </div>
  </main>
</div>

<script>
// 1) Colle ici la config de TON projet Firebase (Paramètres du projet > Tes applications > Web)
const CFG = { apiKey:"COLLE_ICI", authDomain:"", projectId:"", appId:"" };

const TYPES = { revenu:'Revenus', charge:'Charges fixes et dépenses', dette:'Crédits et dettes', epargne:'Épargne' };
const MODELE = {
  revenu:['Salaire'],
  charge:['Logement','Assurances','Énergie','Téléphone et internet','Alimentation','Abonnements','Famille'],
  dette:['Crédit conso 1','Crédit conso 2','LOA auto'],
  epargne:['Livret','PEA','Fonds d\'urgence']
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n => (+n || 0).toLocaleString('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const sum = (t, f='amount') => items.filter(i => i.type === t).reduce((s, i) => s + (+i[f] || 0), 0);

let items = [], deps = [], unsub = null, pending = false, col;

if (CFG.apiKey.startsWith('COLLE')) {
  $('#login').hidden = false;
  $('#lf').innerHTML = '<h1>Config manquante</h1><p>Ouvre budget.html et colle la config Firebase dans <b>CFG</b>.</p>';
} else {
  firebase.initializeApp(CFG);
  const auth = firebase.auth(), db = firebase.firestore();
  col = db.collection('budget_items');

  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try { await auth.signInWithEmailAndPassword($('#em').value, $('#pw').value); }
    catch { $('#lerr').textContent = 'Email ou mot de passe incorrect.'; }
  };
  $('#out').onclick = () => auth.signOut();

  // Dépenses réelles : même principe, un champ à la fois, synchronisé en direct
  const dcol = db.collection('budget_depenses');
  let dun = null;
  auth.onAuthStateChanged(u => {
    if (dun) { dun(); dun = null; }
    if (u) dun = dcol.orderBy('date', 'desc').onSnapshot(s => { deps = s.docs.map(d => ({ id:d.id, ...d.data() })); renderDep(); renderPrev(); });
  });
  $('#dm').onchange = renderDep;
  $('#dadd').onclick = () => {
    const a = parseFloat($('#da').value);
    if (!a || !$('#dd').value) return;
    dcol.add({ date:$('#dd').value, label:$('#dl').value || 'Dépense', category:$('#dc').value, amount:a, by:auth.currentUser.email });
    $('#da').value = ''; $('#dl').value = '';
  };
  $('#dtb').addEventListener('change', e => {
    const i = e.target, tr = i.closest('tr');
    if (!tr || !i.dataset.f) return;
    dcol.doc(tr.dataset.id).update({ [i.dataset.f]: i.type === 'number' ? (parseFloat(i.value) || 0) : i.value, by:auth.currentUser.email });
  });
  $('#dtb').addEventListener('click', e => {
    if (e.target.dataset.del && confirm('Supprimer cette dépense pour vous deux ?')) dcol.doc(e.target.dataset.del).delete();
  });
  $('#dtb').addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement.closest('#dtb')) renderDep(); }, 150));

  auth.onAuthStateChanged(u => {
    if (unsub) { unsub(); unsub = null; }
    $('#login').hidden = !!u; $('#app').hidden = !u;
    if (!u) return;
    $('#who').textContent = u.email;
    unsub = col.orderBy('order').onSnapshot(s => {
      items = s.docs.map(d => ({ id:d.id, ...d.data() }));
      $('#sync').textContent = '● Synchronisé en direct';
      render(); renderPrev();
    }, err => $('#sync').textContent = 'Erreur : ' + err.code);
  });

  // Édition : on met à jour UN seul champ, donc deux personnes peuvent modifier des champs différents sans s'écraser
  $('#secs').addEventListener('change', e => {
    const i = e.target, tr = i.closest('tr');
    if (!tr || !i.dataset.f) return;
    const v = i.type === 'number' ? (parseFloat(i.value) || 0) : i.value;
    col.doc(tr.dataset.id).update({ [i.dataset.f]:v, by:auth.currentUser.email });
  });
  $('#secs').addEventListener('focusout', () => setTimeout(() => {
    if (pending && !document.activeElement.closest('#secs')) render();
  }, 150));
  $('#secs').addEventListener('click', async e => {
    const email = auth.currentUser.email;
    if (e.target.dataset.add) {
      col.add({ type:e.target.dataset.add, label:'Nouvelle ligne', amount:0, balance:0, rate:0, order:Date.now(), by:email });
    } else if (e.target.dataset.del) {
      if (confirm('Supprimer cette ligne pour vous deux ?')) col.doc(e.target.dataset.del).delete();
    } else if (e.target.id === 'seed') {
      const b = db.batch(); let o = Date.now();
      for (const [type, labels] of Object.entries(MODELE))
        labels.forEach(label => b.set(col.doc(), { type, label, amount:0, balance:0, rate:0, order:o++, by:email }));
      await b.commit();
    }
  });
}

const CATS = ['Alimentation','Logement','Transport','Santé','Loisirs','Famille','Autre'];
const PAL = ['#0f766e','#b7791f','#b4432f','#2f5d8a','#6b4e9b','#7a8a3a','#667684'];
let c1, c2;

// Enveloppes mensuelles par catégorie, stockées dans budget_items (type 'enveloppe')
function renderEnv(by) {
  if (document.activeElement && document.activeElement.closest('#etb')) return;
  $('#etb').innerHTML = CATS.map(c => {
    const ex = items.find(i => i.type === 'enveloppe' && i.label === c);
    const e = ex ? (+ex.amount || 0) : 0, r = by[c] || 0, p = e ? Math.round(r / e * 100) : 0;
    const col = e && r > e ? 'var(--red)' : 'var(--teal)';
    return `<tr data-cat="${c}"><td>${c}</td><td><input type="number" step="any" value="${e}"></td><td>${eur(r)}</td>`
      + `<td style="color:${col};font-weight:700">${e ? eur(e - r) : '—'}</td><td class="m" style="color:${col}">${e ? p + ' %' : '—'}</td></tr>`;
  }).join('');
}

// Prévision = revenus − (charges fixes + crédits) − épargne − variables prévus
function renderPrev(m, tot) {
  const hist = [1, 2, 3].map(n => {
    const d = new Date(+m.slice(0, 4), +m.slice(5) - 1 - n, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    return deps.filter(x => (x.date || '').startsWith(k)).reduce((s, x) => s + (+x.amount || 0), 0);
  }).filter(v => v > 0);
  const moy = hist.length ? hist.reduce((a, b) => a + b, 0) / hist.length : 0;
  const env = sum('enveloppe'), vari = env || moy;
  const fixe = sum('charge') + sum('dette'), eps = sum('epargne'), rev = sum('revenu');
  const solde = rev - fixe - eps - vari;
  const row = (l, v, note, color) => `<tr><td>${l}<div class="by">${note || ''}</div></td><td style="text-align:right;font-weight:700;color:${color || 'inherit'}">${eur(v)}</td></tr>`;
  $('#ptb').innerHTML = row('Revenus', rev)
    + row('Charges fixes et crédits', -fixe)
    + row('Épargne', -eps)
    + row('Dépenses variables prévues', -vari, env ? 'Total de vos enveloppes' : (moy ? 'Moyenne des 3 mois précédents' : 'Définissez des enveloppes ci-dessus'))
    + row('Solde prévu', solde, tot ? 'Déjà dépensé ce mois : ' + eur(tot) : '', solde < 0 ? 'var(--red)' : 'var(--teal)');
}

const drow = d => `<tr data-id="${d.id}"><td><input data-f="date" type="date" value="${esc(d.date)}"></td>`
  + `<td><input data-f="label" value="${esc(d.label)}"></td>`
  + `<td><select data-f="category">${CATS.map(c => `<option${c === d.category ? ' selected' : ''}>${c}</option>`).join('')}</select></td>`
  + `<td><input data-f="amount" type="number" step="any" value="${+d.amount || 0}"></td>`
  + `<td class="by">${esc((d.by || '').split('@')[0])}</td><td><button class="del" data-del="${d.id}" aria-label="Supprimer">✕</button></td></tr>`;

function renderDep() {
  const m = $('#dm').value;
  const mois = deps.filter(d => (d.date || '').startsWith(m));
  const by = {};
  mois.forEach(d => by[d.category] = (by[d.category] || 0) + (+d.amount || 0));
  const tot = Object.values(by).reduce((a, b) => a + b, 0);
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
  const reste = sum('revenu') - sum('charge') - sum('dette') - sum('epargne');
  $('#dsum').innerHTML = `<div><small>Dépensé ce mois</small><b>${eur(tot)}</b></div>`
    + `<div><small>Nombre de dépenses</small><b>${mois.length}</b></div>`
    + `<div><small>Plus gros poste</small><b>${top ? esc(top[0]) : '—'}</b></div>`
    + `<div class="rest"><small>Reste à vivre du budget</small><b class="${reste < 0 ? 'neg' : ''}">${eur(reste)}</b></div>`;
  renderEnv(by); renderPrev(m, tot);
  if (!(document.activeElement && document.activeElement.closest('#dtb')))
    $('#dtb').innerHTML = mois.map(drow).join('') || '<tr><td colspan="6" class="empty">Aucune dépense ce mois-ci.</td></tr>';
  if (!window.Chart) return;
  const ks = [...Array(6)].map((_, i) => {
    const d = new Date(+m.slice(0, 4), +m.slice(5) - 6 + i, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  });
  const vals = ks.map(k => deps.filter(d => (d.date || '').startsWith(k)).reduce((s, d) => s + (+d.amount || 0), 0));
  if (c1) c1.destroy(); if (c2) c2.destroy();
  c1 = new Chart($('#c1'), { type:'doughnut', data:{ labels:Object.keys(by), datasets:[{ data:Object.values(by), backgroundColor:PAL }] }, options:{ maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } } } });
  c2 = new Chart($('#c2'), { type:'bar', data:{ labels:ks, datasets:[{ label:'Dépenses €', data:vals, backgroundColor:'#0f766e' }] }, options:{ maintainAspectRatio:false, plugins:{ legend:{ display:false } } } });
}

$('#dc').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');
const hoy = new Date().toISOString().slice(0, 10);
$('#dd').value = hoy; $('#dm').value = hoy.slice(0, 7);
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#v-budget').hidden = b.dataset.t !== 'budget';
  $('#v-dep').hidden = b.dataset.t !== 'dep';
  $('#v-prev').hidden = b.dataset.t !== 'prev';
  if (b.dataset.t === 'dep') renderDep();
  if (b.dataset.t === 'prev') renderPrev();
});

// Charges sans catégorie = fixes. Charges avec catégorie = enveloppes variables, comparées aux dépenses réelles.
function renderPrev() {
  if ($('#v-prev').hidden) return;
  const m = $('#pm').value;
  const ym = (y, mo) => { const d = new Date(y, mo, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const ks = [1, 2, 3].map(i => ym(+m.slice(0, 4), +m.slice(5) - 1 - i));
  const of = k => deps.filter(d => (d.date || '').startsWith(k));
  const tot = (list, c) => list.filter(d => d.category === c).reduce((s, d) => s + (+d.amount || 0), 0);
  const env = {};
  items.filter(i => i.type === 'charge' && i.cat).forEach(i => env[i.cat] = (env[i.cat] || 0) + (+i.amount || 0));
  const fixes = items.filter(i => i.type === 'charge' && !i.cat).reduce((s, i) => s + (+i.amount || 0), 0) + sum('dette');
  const base = ks.filter(k => of(k).length);
  const cats = CATS.filter(c => env[c] || deps.some(d => d.category === c));
  let vars = 0;
  const rows = cats.map(c => {
    const e = env[c] || 0, r = tot(of(m), c);
    const a = base.length ? base.reduce((s, k) => s + tot(of(k), c), 0) / base.length : e;
    vars += a;
    const w = e ? Math.min(100, r / e * 100) : (r ? 100 : 0);
    return `<tr><td class="p">${c}</td><td class="p">${e ? eur(e) : '—'}</td>`
      + `<td class="p">${eur(r)}<div class="bar${r > e ? ' over' : ''}"><i style="width:${w}%"></i></div></td>`
      + `<td class="p" style="color:${e - r < 0 ? 'var(--red)' : 'var(--teal)'}">${e ? eur(e - r) : '—'}</td>`
      + `<td class="p">${base.length ? eur(a) : '—'}</td><td class="p"><b>${eur(a)}</b></td></tr>`;
  });
  const rev = sum('revenu'), eps = sum('epargne'), reste = rev - fixes - vars - eps;
  $('#psum').innerHTML = `<div><small>Revenus</small><b>${eur(rev)}</b></div>`
    + `<div><small>Fixes et crédits</small><b>${eur(fixes)}</b></div>`
    + `<div><small>Variables prévues</small><b>${eur(vars)}</b></div>`
    + `<div><small>Épargne</small><b>${eur(eps)}</b></div>`
    + `<div class="rest"><small>Reste prévu</small><b class="${reste < 0 ? 'neg' : ''}">${eur(reste)}</b></div>`;
  $('#ptab').innerHTML = cats.length
    ? `<table><tr><th>Catégorie</th><th>Enveloppe</th><th>Réel du mois</th><th>Écart</th><th>Moy. 3 mois</th><th>Prévision</th></tr>${rows.join('')}</table>`
    : `<div class="empty">Dans l'onglet Budget, associez vos charges variables à une catégorie (colonne « Fixe ou catégorie ») pour les comparer à vos dépenses.</div>`;
}
$('#pm').value = new Date().toISOString().slice(0, 7);
$('#pm').onchange = renderPrev;

function fin(it) {
  const P = +it.amount, B = +it.balance, r = (+it.rate || 0) / 1200;
  if (!P || !B) return '—';
  const n = r ? (P > r * B ? -Math.log(1 - r * B / P) / Math.log(1 + r) : Infinity) : B / P;
  return isFinite(n) ? Math.ceil(n) + ' mois' : 'Ne se rembourse pas';
}

function row(it) {
  const d = it.type === 'dette';
  const num = (f, v) => `<td><input data-f="${f}" type="number" step="any" value="${+v || 0}"></td>`;
  return `<tr data-id="${it.id}"><td><input data-f="label" value="${esc(it.label)}"></td>${num('amount', it.amount)}`
    + (it.type === 'charge' ? `<td><select data-f="cat"><option value="">Fixe</option>${CATS.map(c => `<option${c === it.cat ? ' selected' : ''}>${c}</option>`).join('')}</select></td>` : '')
    + (d ? num('balance', it.balance) + num('rate', it.rate) + `<td class="m">${fin(it)}</td>` : '')
    + `<td class="by">${esc((it.by || '').split('@')[0])}</td><td><button class="del" data-del="${it.id}" aria-label="Supprimer">✕</button></td></tr>`;
}

function render() {
  const rev = sum('revenu'), out = sum('charge') + sum('dette'), eps = sum('epargne'), rest = rev - out - eps;
  $('#sum').innerHTML =
    `<div><small>Revenus / mois</small><b>${eur(rev)}</b></div>`
    + `<div><small>Charges et crédits</small><b>${eur(out)}</b></div>`
    + `<div><small>Épargne</small><b>${eur(eps)}</b></div>`
    + `<div class="rest"><small>Reste à vivre</small><b class="${rest < 0 ? 'neg' : ''}">${eur(rest)}</b></div>`
    + `<div><small>Dette restante</small><b>${eur(sum('dette', 'balance'))}</b></div>`;

  if (document.activeElement && document.activeElement.closest('#secs')) { pending = true; return; }
  pending = false;
  if (!items.length) {
    $('#secs').innerHTML = '<section><div class="empty">Aucune ligne pour l\'instant.<br><button id="seed">Charger un modèle de budget</button></div></section>';
    return;
  }
  $('#secs').innerHTML = Object.entries(TYPES).map(([t, name]) => {
    const rows = items.filter(i => i.type === t);
    const head = t === 'dette'
      ? '<th>Libellé</th><th>Mensualité €</th><th>Solde restant €</th><th>Taux %</th><th>Fin estimée</th><th>Modifié par</th><th></th>'
      : t === 'charge'
        ? '<th>Libellé</th><th>Montant € / mois</th><th>Fixe ou catégorie</th><th>Modifié par</th><th></th>'
        : '<th>Libellé</th><th>Montant € / mois</th><th>Modifié par</th><th></th>';
    return `<section><h2>${name}<span>${eur(sum(t))} / mois</span></h2><div class="wrap"><table><tr>${head}</tr>${rows.map(row).join('')}</table></div><button class="add" data-add="${t}">+ Ajouter une ligne</button></section>`;
  }).join('');
}
</script>
</body>
</html>
